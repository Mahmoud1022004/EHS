:root{
  /* Straight from Logo_Color_Guide.pdf */
  --ink:#282828;
  --cyan:#35C2FF;
  --light:#F5F5F5;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%;background:#121212;overflow:hidden}

#viewport{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#121212;
}

/* The frame is always authored at exactly 1080x1920 and scaled to fit, so the
   render is pixel-identical to what you see on screen. */
#frame{
  position:relative;
  width:1080px;height:1920px;
  flex:none;
  background:var(--ink);
  overflow:hidden;
  transform-origin:50% 50%;
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--light);
  -webkit-font-smoothing:antialiased;
}

#shake{position:absolute;inset:0;will-change:transform}

/* ---------------------------------------------------------------- ground -- */
.grid{
  position:absolute;inset:-10%;
  background-image:
    linear-gradient(to right, rgba(245,245,245,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(245,245,245,.055) 1px, transparent 1px);
  background-size:120px 120px;
  opacity:0;
}
.glow{
  position:absolute;left:50%;top:50%;
  width:1700px;height:1700px;margin:-850px 0 0 -850px;
  background:radial-gradient(circle, rgba(53,194,255,.30) 0%, rgba(53,194,255,.10) 34%, transparent 66%);
  opacity:0;will-change:opacity,transform;
}

/* ------------------------------------------------------------------ mark -- */
/* Geometry is measured from the supplied artwork at build time; every value
   below is written by script so the lockup stays true to the logo file. */
.mark{position:absolute;left:0;top:0;will-change:transform}
.bar{position:absolute;background:var(--cyan);will-change:transform,opacity}
.trail{
  position:absolute;
  background:linear-gradient(90deg, rgba(53,194,255,0) 0%, rgba(53,194,255,.85) 100%);
  opacity:0;will-change:transform,opacity,width;
}
.trail.r{background:linear-gradient(270deg, rgba(53,194,255,0) 0%, rgba(53,194,255,.85) 100%)}
.dot{position:absolute;border-radius:50%;background:var(--light);will-change:transform,opacity}
.ring{
  position:absolute;border-radius:50%;
  border:3px solid var(--cyan);
  opacity:0;will-change:transform,opacity;
}
.word{position:absolute;left:0}
.glyph{position:absolute;top:0;overflow:hidden;will-change:transform,opacity}
.glyph img{position:absolute;left:0;display:block;width:100%;will-change:transform}

/* --------------------------------------------------------------- copy fx -- */
/* Barlow Condensed isn't available offline, so supporting copy is Manrope
   given a measured horizontal compression to sit with the condensed wordmark. */
/* Origin is the left edge so compressed lines stay flush, not ragged. */
.cond{display:inline-block;transform:scaleX(.88);transform-origin:0 50%}

.scene{position:absolute;inset:0;padding:0 96px;display:none;
  flex-direction:column;justify-content:center}
.scene.on{display:flex}

.kicker{
  font-size:24px;font-weight:700;letter-spacing:.42em;
  color:var(--cyan);text-transform:uppercase;
  overflow:hidden;
}
.kicker span{display:block;will-change:transform,opacity}

.line{overflow:hidden;display:block}
.line-in{
  display:block;
  font-size:98px;font-weight:800;line-height:1.06;
  letter-spacing:-.015em;text-transform:uppercase;
  will-change:transform,opacity;
}
.line-in.accent{color:var(--cyan)}

.rule{
  height:4px;background:var(--cyan);
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;
}

/* capability rows */
.row{position:relative;padding:26px 0 22px}
.row .hair{
  position:absolute;left:0;right:0;top:0;height:2px;
  background:rgba(245,245,245,.20);
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;
}
.row .num{
  font-size:22px;font-weight:700;letter-spacing:.3em;color:var(--cyan);
  margin-bottom:10px;will-change:opacity,transform;
}
.row .label{overflow:hidden}
.row .label b{
  display:block;font-size:86px;font-weight:800;line-height:1;
  text-transform:uppercase;letter-spacing:-.02em;
  will-change:transform,opacity;
}

/* Kinetic statement. The condensing sits on the line, not the words, so the
   gaps between words stay even and each word keeps its own transform. */
.stmt{
  display:flex;flex-wrap:nowrap;gap:0 30px;
  transform:scaleX(.88);transform-origin:0 50%;
}
.stmt .w{
  font-size:104px;font-weight:800;line-height:1.14;
  text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap;
  will-change:transform,opacity;
}
.stmt .w.accent{color:var(--cyan)}

/* tagline under the closing lockup */
.tagline{
  position:absolute;left:0;right:0;
  text-align:center;
  font-size:32px;font-weight:700;text-transform:uppercase;
  color:rgba(245,245,245,.82);
  opacity:0;will-change:opacity,letter-spacing;
}

/* ------------------------------------------------------------ transitions -- */
.wipe{position:absolute;top:0;bottom:0;width:0;background:#202020;will-change:width}
.wipe.l{left:0;border-right:5px solid var(--cyan)}
.wipe.r{right:0;border-left:5px solid var(--cyan)}

/* ------------------------------------------------------------------ film -- */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 46%, rgba(0,0,0,.55) 100%);
}
.grain{
  position:absolute;inset:-200px;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}
</style>

/* ------------------------------------------------------------------ copy -- *
 * Everything the reel says lives here — edit these strings to re-voice the
 * film without touching a single keyframe.                                   */
const COPY = {
  kicker3:     'AdFirst / Brand Marketing',
  positioning: ["WE DON'T CHASE", 'ATTENTION.', 'WE COMMAND IT.'],
  kicker4:     'What we do',
  capabilities:['STRATEGY', 'CREATIVE', 'MEDIA', 'PERFORMANCE'],
  statement:   [['BUILT', 'FOR'], ['BRANDS', 'THAT'], ['REFUSE', 'TO'], ['BLEND', 'IN.']],
  accentFrom:  6,               // index in the flattened word list where cyan starts
  tagline:     'Put your brand first',
};

const DURATION = 15.0;          // seconds
const FPS      = 30;
const STAGE_W  = 1080;
const STAGE_H  = 1920;

/* --------------------------------------------------------------- easings -- */
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const prog  = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const outExpo  = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outQuint = x => 1 - Math.pow(1 - x, 5);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inCubic  = x => x * x * x;
const outBack  = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const mix = (a, b, t) => a + (b - a) * t;

const $ = id => document.getElementById(id);

/* ------------------------------------------------------------ build mark -- */
/* The mark is reconstructed from the artwork's own measurements: the two rules
   and the dot are drawn live (so they can move independently) while the seven
   letters are the real Barlow Condensed glyphs lifted from the logo file. */
const MARK_W  = 806;                                   // on-stage width, px
const SRC_W   = B.word.x1 - B.word.x0 + 1;             // same span in artwork px
const U       = MARK_W / SRC_W;                        // artwork px -> stage px
const px      = n => n * U;

const barH    = px(B.bar.y1 - B.bar.y0 + 1);
const barLW   = px(B.bar.left[1]  - B.bar.left[0]  + 1);
const barRW   = px(B.bar.right[1] - B.bar.right[0] + 1);
const barRX   = px(B.bar.right[0] - B.word.x0);
const barCY   = px(B.bar.cy - B.bar.y0);
const dotX    = px(B.dot.x0 - B.word.x0);
const dotY    = px(B.dot.y0 - B.bar.y0);
const dotD    = px(B.dot.x1 - B.dot.x0 + 1);
const wordY   = px(B.word.y0 - B.bar.y0);
const wordH   = px(B.word.y1 - B.word.y0 + 1);
const MARK_H  = px(B.word.y1 - B.bar.y0 + 1);

const MARK_X  = (STAGE_W - MARK_W) / 2;
const MARK_Y  = (STAGE_H - MARK_H) / 2;

const mark = $('mark');
Object.assign(mark.style, { width: MARK_W + 'px', height: MARK_H + 'px',
                            left: MARK_X + 'px', top: MARK_Y + 'px' });

const barL = $('barL'), barR = $('barR'), dot = $('dot'), ring = $('ring');
Object.assign(barL.style, { left: '0px', top: '0px', width: barLW + 'px', height: barH + 'px' });
Object.assign(barR.style, { left: barRX + 'px', top: '0px', width: barRW + 'px', height: barH + 'px' });
Object.assign(dot.style,  { left: dotX + 'px', top: dotY + 'px', width: dotD + 'px', height: dotD + 'px' });
Object.assign(ring.style, { left: dotX + 'px', top: dotY + 'px', width: dotD + 'px', height: dotD + 'px' });

const trailL = $('trailL'), trailR = $('trailR');
Object.assign(trailL.style, { left: '0px', top: '0px', height: barH + 'px' });
Object.assign(trailR.style, { left: barRX + barRW + 'px', top: '0px', height: barH + 'px' });

/* Seven glyph masks, each positioned exactly where it sits in the artwork. */
const word = $('word');
Object.assign(word.style, { top: wordY + 'px', width: MARK_W + 'px', height: wordH + 'px' });

const glyphs = B.glyphs.map(g => {
  const holder = document.createElement('div');
  holder.className = 'glyph';
  const left = px(g.x0 - B.pad - B.word.x0);
  const w    = px(g.x1 - g.x0 + 1 + B.pad * 2);
  const h    = px(B.word.y1 - B.word.y0 + 1 + B.pad * 2);
  Object.assign(holder.style, { left: left + 'px', top: px(-B.pad) + 'px',
                                width: w + 'px', height: h + 'px' });
  const img = document.createElement('img');
  img.src = g.src;
  img.alt = g.name;
  holder.appendChild(img);
  word.appendChild(holder);
  return { holder, img, h };
});

/* ---------------------------------------------------------- build scenes -- */
function lineBlock(text, accent) {
  const outer = document.createElement('div');
  outer.className = 'line';
  const inner = document.createElement('div');
  inner.className = 'line-in' + (accent ? ' accent' : '');
  const span = document.createElement('span');
  span.className = 'cond';
  span.textContent = text;
  inner.appendChild(span);
  outer.appendChild(inner);
  return { outer, inner };
}

// Scene 3 — positioning
const s3 = $('s3');
const s3kick = document.createElement('div');
s3kick.className = 'kicker';
s3kick.style.marginBottom = '42px';
const s3kickIn = document.createElement('span');
s3kickIn.textContent = COPY.kicker3;
s3kick.appendChild(s3kickIn);
s3.appendChild(s3kick);

const s3lines = COPY.positioning.map((txt, i) => {
  const l = lineBlock(txt, i === COPY.positioning.length - 1);
  s3.appendChild(l.outer);
  return l;
});
const s3rule = document.createElement('div');
s3rule.className = 'rule';
s3rule.style.marginTop = '46px';
s3rule.style.width = '340px';
s3.appendChild(s3rule);

// Scene 4 — capabilities
const s4 = $('s4');
const s4kick = document.createElement('div');
s4kick.className = 'kicker';
s4kick.style.marginBottom = '54px';
const s4kickIn = document.createElement('span');
s4kickIn.textContent = COPY.kicker4;
s4kick.appendChild(s4kickIn);
s4.appendChild(s4kick);

const s4rows = COPY.capabilities.map((label, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  const hair = document.createElement('div');
  hair.className = 'hair';
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String(i + 1).padStart(2, '0');
  const wrap = document.createElement('div');
  wrap.className = 'label';
  const b = document.createElement('b');
  const span = document.createElement('span');
  span.className = 'cond';
  span.textContent = label;
  b.appendChild(span);
  wrap.appendChild(b);
  row.append(hair, num, wrap);
  s4.appendChild(row);
  return { hair, num, b };
});

// Scene 5 — kinetic statement
const s5 = $('s5');
let flat = 0;
const s5words = [];
COPY.statement.forEach(lineWords => {
  const line = document.createElement('div');
  line.className = 'stmt';
  lineWords.forEach(w => {
    const el = document.createElement('div');
    el.className = 'w' + (flat >= COPY.accentFrom ? ' accent' : '');
    el.textContent = w;
    line.appendChild(el);
    s5words.push(el);
    flat++;
  });
  s5.appendChild(line);
});

const tagline = $('tagline');
tagline.textContent = COPY.tagline;

/* ------------------------------------------------------------- timeline -- */
const T = {
  barsIn:   [0.12, 1.08],
  impact:    0.98,
  glyphs:   [2.14, 0.062, 0.60],   // first glyph start, per-glyph stagger, duration
  wipe1:     4.10,                 // -> positioning
  wipe2:     6.95,                 // -> capabilities
  wipe3:    10.02,                 // -> statement
  wipe4:    12.18,                 // -> closing lockup
  WIPE_IN:   0.28,
  WIPE_HOLD: 0.06,
  WIPE_OUT:  0.36,
};
const wipeMid = t0 => t0 + T.WIPE_IN;                       // frame is fully covered
const wipeEnd = t0 => t0 + T.WIPE_IN + T.WIPE_HOLD + T.WIPE_OUT;

/* Curtain wipe built from the logo's own two bars. Returns each panel's width
   as a fraction of half the frame. */
function wipeAmount(t, t0) {
  const inP  = outQuint(prog(t, t0, t0 + T.WIPE_IN));
  const outP = outQuint(prog(t, t0 + T.WIPE_IN + T.WIPE_HOLD, wipeEnd(t0)));
  return Math.max(0, inP - outP);
}

/* --------------------------------------------------------------- render -- */
const shake = $('shake'), grid = $('grid'), glow = $('glow');
const wipeL = $('wipeL'), wipeR = $('wipeR'), grain = $('grain');

function render(t) {
  // ------------------------------------------------ which scene is on air --
  const inMark  = t < wipeMid(T.wipe1) || t >= wipeMid(T.wipe4);
  const inS3    = t >= wipeMid(T.wipe1) && t < wipeMid(T.wipe2);
  const inS4    = t >= wipeMid(T.wipe2) && t < wipeMid(T.wipe3);
  const inS5    = t >= wipeMid(T.wipe3) && t < wipeMid(T.wipe4);
  const closing = t >= wipeMid(T.wipe4);

  mark.style.display = inMark ? 'block' : 'none';
  s3.classList.toggle('on', inS3);
  s4.classList.toggle('on', inS4);
  s5.classList.toggle('on', inS5);

  // ------------------------------------------------------------- ambience --
  grid.style.opacity = (0.55 * outCubic(prog(t, 0.35, 1.70)) * (1 - prog(t, 13.9, 15.0) * 0.5)).toFixed(4);

  // Cyan bloom: punches on impact, breathes under the closing lockup.
  const bloomHit  = Math.pow(1 - prog(t, T.impact, T.impact + 1.25), 2);
  const bloomEnd  = closing ? 0.45 * outCubic(prog(t, 13.0, 14.2)) * (0.88 + 0.12 * Math.sin(t * 2.4)) : 0;
  glow.style.opacity  = Math.max(bloomHit * 0.9, bloomEnd).toFixed(4);
  glow.style.transform = `scale(${(0.72 + 0.30 * outCubic(prog(t, T.impact, T.impact + 1.4))).toFixed(4)})`;

  // Impact shake — deterministic, decaying.
  const sh = Math.pow(1 - prog(t, T.impact, T.impact + 0.36), 2);
  if (sh > 0.001) {
    const k = (t - T.impact) * 132;
    shake.style.transform =
      `translate(${(Math.sin(k) * 15 * sh).toFixed(2)}px, ${(Math.cos(k * 1.37) * 9 * sh).toFixed(2)}px)`;
  } else {
    shake.style.transform = 'translate(0,0)';
  }

  // Animated film grain, stepped per frame so it reads as grain, not drift.
  const f = Math.floor(t * FPS);
  grain.style.backgroundPosition = `${(f * 71) % 200}px ${(f * 137) % 200}px`;

  // ------------------------------------------------------ the mark itself --
  if (inMark) {
    // Opening flight, and again — quicker — for the closing lockup.
    const open = !closing;
    const inA  = open ? T.barsIn[0] : T.wipe4 + 0.34;
    const inB  = open ? T.barsIn[1] : T.wipe4 + 1.12;
    const hit  = open ? T.impact    : T.wipe4 + 1.02;

    const e   = outExpo(prog(t, inA, inB));
    const off = 660 * (1 - e);
    barL.style.transform = `translateX(${(-off).toFixed(2)}px)`;
    barR.style.transform = `translateX(${off.toFixed(2)}px)`;
    barL.style.opacity = barR.style.opacity = clamp(prog(t, inA, inA + 0.10)).toFixed(3);

    // Speed streaks trailing the inner edge of each bar.
    const streak = Math.pow(1 - e, 0.55);
    const sw = (300 * streak).toFixed(1) + 'px';
    trailL.style.width = trailR.style.width = sw;
    trailL.style.opacity = trailR.style.opacity = (streak * 0.85).toFixed(3);
    trailL.style.transform = `translateX(${(-off + barLW).toFixed(2)}px)`;
    trailR.style.transform = `translateX(${(off - 300 * streak).toFixed(2)}px)`;

    // Dot lands on impact with a little overshoot.
    const dp = prog(t, hit, hit + 0.38);
    dot.style.opacity = dp > 0 ? '1' : '0';
    dot.style.transform = `scale(${dp > 0 ? outBack(dp).toFixed(4) : 0})`;

    // Shockwave ring off the dot.
    const rp = prog(t, hit, hit + 0.80);
    ring.style.opacity = rp > 0 && rp < 1 ? ((1 - rp) * 0.8).toFixed(3) : '0';
    ring.style.transform = `scale(${mix(1, 11, outQuint(rp)).toFixed(3)})`;

    // Wordmark: each letter rises out of its own mask.
    const g0  = open ? T.glyphs[0] : T.wipe4 + 1.10;
    const gap = open ? T.glyphs[1] : 0.040;
    const dur = open ? T.glyphs[2] : 0.48;
    glyphs.forEach((g, i) => {
      const p = prog(t, g0 + i * gap, g0 + i * gap + dur);
      const e2 = outExpo(p);
      g.img.style.transform = `translateY(${((1 - e2) * g.h).toFixed(2)}px)`;
      g.holder.style.opacity = clamp(p * 2.4).toFixed(3);
    });

    // The closing lockup sits high to leave room for the tagline.
    mark.style.transform = closing ? 'translateY(-58px)' : 'translateY(0)';
  }

  // --------------------------------------------------------------- tagline --
  if (closing) {
    const p = prog(t, T.wipe4 + 1.72, T.wipe4 + 2.45);
    tagline.style.top = (MARK_Y + MARK_H + 92) + 'px';
    tagline.style.opacity = outCubic(p).toFixed(3);
    tagline.style.letterSpacing = mix(0.10, 0.42, outExpo(p)).toFixed(4) + 'em';
  } else {
    tagline.style.opacity = '0';
  }

  // ------------------------------------------------------------- scene 3 --
  if (inS3) {
    const t0 = wipeMid(T.wipe1);
    const kp = prog(t, t0 + 0.06, t0 + 0.52);
    s3kickIn.style.transform = `translateY(${((1 - outExpo(kp)) * 100).toFixed(2)}%)`;
    s3kickIn.style.opacity = clamp(kp * 2).toFixed(3);

    const starts = [t0 + 0.16, t0 + 0.28, t0 + 1.02];
    s3lines.forEach((l, i) => {
      const p  = prog(t, starts[i], starts[i] + 0.66);
      const ex = prog(t, T.wipe2 - 0.34 + i * 0.05, T.wipe2 + 0.02 + i * 0.05);
      const y  = (1 - outExpo(p)) * 108 - inCubic(ex) * 108;
      l.inner.style.transform = `translateY(${y.toFixed(2)}%)`;
      l.inner.style.opacity = clamp(p * 2.4).toFixed(3);
    });

    const rp = prog(t, t0 + 1.42, t0 + 1.95);
    s3rule.style.transform = `scaleX(${outExpo(rp).toFixed(4)})`;
  }

  // ------------------------------------------------------------- scene 4 --
  if (inS4) {
    const t0 = wipeMid(T.wipe2);
    const kp = prog(t, t0 + 0.04, t0 + 0.50);
    s4kickIn.style.transform = `translateY(${((1 - outExpo(kp)) * 100).toFixed(2)}%)`;
    s4kickIn.style.opacity = clamp(kp * 2).toFixed(3);

    s4rows.forEach((r, i) => {
      const s  = t0 + 0.18 + i * 0.19;
      const ex = prog(t, T.wipe3 - 0.40 + i * 0.05, T.wipe3 + 0.02 + i * 0.05);
      const slide = -inCubic(ex) * 26;

      r.hair.style.transform = `scaleX(${outExpo(prog(t, s, s + 0.52)).toFixed(4)})`;

      const np = prog(t, s + 0.08, s + 0.44);
      r.num.style.opacity = (outCubic(np) * (1 - inCubic(ex))).toFixed(3);
      r.num.style.transform = `translateX(${(((1 - outExpo(np)) * 26) + slide).toFixed(2)}px)`;

      const lp = prog(t, s + 0.10, s + 0.74);
      r.b.style.transform = `translateY(${((1 - outExpo(lp)) * 105 + inCubic(ex) * 105).toFixed(2)}%)`;
      r.b.style.opacity = clamp(lp * 2.4).toFixed(3);
    });
  }

  // ------------------------------------------------------------- scene 5 --
  if (inS5) {
    const t0 = wipeMid(T.wipe3);
    s5words.forEach((w, i) => {
      const s  = t0 + 0.12 + i * 0.108;
      const p  = prog(t, s, s + 0.40);
      const ex = prog(t, T.wipe4 - 0.30, T.wipe4 + 0.04);
      const e  = outExpo(p);
      w.style.opacity = (clamp(p * 2.6) * (1 - inCubic(ex))).toFixed(3);
      w.style.transform =
        `translateY(${((1 - e) * 34 - inCubic(ex) * 30).toFixed(2)}px) scale(${mix(1.14, 1, e).toFixed(4)})`;
    });
  }

  // --------------------------------------------------------------- wipes --
  let cover = 0;
  for (const t0 of [T.wipe1, T.wipe2, T.wipe3, T.wipe4]) {
    if (t >= t0 && t <= wipeEnd(t0)) { cover = wipeAmount(t, t0); break; }
  }
  const half = (STAGE_W / 2) * cover;
  wipeL.style.width = half.toFixed(2) + 'px';
  wipeR.style.width = half.toFixed(2) + 'px';
}

/* ------------------------------------------------------- drive / capture -- */
function fit() {
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  $('frame').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
fit();

// Deterministic entry point used by render.mjs — one call, one exact frame.
window.__seek = t => { render(clamp(t, 0, DURATION)); };
window.__meta = { duration: DURATION, fps: FPS, width: STAGE_W, height: STAGE_H };

// Loop when opened normally, so the file doubles as a preview.
let t0 = null;
let live = true;
function frame(now) {
  if (live) {
    if (t0 === null) t0 = now;
    render(((now - t0) / 1000) % DURATION);
  }
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => {
  render(0);
  requestAnimationFrame(frame);
});
// render.mjs freezes playback before stepping frames.
window.__freeze = () => { live = false; };
</script>
