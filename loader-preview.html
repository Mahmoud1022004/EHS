<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHS Loading Screen — Vital Pulse preview</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logos/EHS-app-icon.svg">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{--ink:#10291C;--forest:#176B45;--logo-green:#8DBE22;--mint:#DCEFD9}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);font-family:"Manrope",Arial,sans-serif;overflow:hidden}

  .loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}

  /* the heartbeat trace */
  .ecg{position:absolute;inset:0;width:100%;height:100%}
  .ecg path{
    fill:none;stroke:var(--logo-green);stroke-width:3;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1500;stroke-dashoffset:1500;
  }
  .play .ecg path{animation:trace 2.2s cubic-bezier(.4,.05,.3,1) forwards, dim .9s 2.3s forwards}

  /* the green pulse that swells out of the peak */
  .pulse{
    position:absolute;left:50%;top:63%;width:150px;height:150px;margin:-75px 0 0 -75px;
    border-radius:50%;opacity:0;
    background:radial-gradient(circle,rgba(141,190,34,.75) 0%,rgba(141,190,34,.28) 45%,transparent 72%);
  }
  .play .pulse{animation:swell 1.5s 1.05s cubic-bezier(.2,.7,.3,1) forwards}
  .pulse--ring{
    position:absolute;left:50%;top:63%;width:110px;height:110px;margin:-55px 0 0 -55px;
    border-radius:50%;border:2px solid rgba(141,190,34,.55);opacity:0;
  }
  .play .pulse--ring{animation:ring 1.6s 1.15s cubic-bezier(.2,.7,.3,1) forwards}

  .logo{width:min(82vw,720px);opacity:0;transform:translateY(18px) scale(.96)}
  .play .logo{animation:logoIn .85s 1.35s cubic-bezier(.2,.9,.25,1.15) forwards}

  @keyframes trace{to{stroke-dashoffset:0}}
  @keyframes dim{to{opacity:.16}}
  @keyframes swell{
    0%{opacity:0;transform:scale(.35)}
    30%{opacity:1}
    100%{opacity:0;transform:scale(6.5)}
  }
  @keyframes ring{
    0%{opacity:.9;transform:scale(.4)}
    60%{opacity:.25}
    100%{opacity:0;transform:scale(7)}
  }
  @keyframes logoIn{to{opacity:1;transform:none}}

  .bar{position:fixed;inset-inline:0;bottom:0;display:flex;gap:12px;justify-content:center;
       padding:16px;background:rgba(16,41,28,.65);backdrop-filter:blur(8px)}
  .bar button,.bar a{font:inherit;font-weight:700;font-size:.9rem;padding:11px 22px;border-radius:999px;
       border:1.5px solid rgba(220,239,217,.5);background:transparent;color:var(--mint);cursor:pointer;text-decoration:none}
  .bar button:hover,.bar a:hover{background:var(--mint);color:var(--ink)}
  .hint{position:fixed;top:18px;inset-inline:0;text-align:center;color:rgba(220,239,217,.55);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
</style>
</head>
<body>
<p class="hint">Preview — concept 2 · Vital Pulse</p>

<div class="loader play" id="loader">
  <svg class="ecg" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 252 H430 l22 -6 l18 46 l22 -96 l20 84 l18 -28 H700 l22 -6 l16 26 l20 -50 l18 36 l16 -6 H1200"/>
  </svg>
  <span class="pulse" aria-hidden="true"></span>
  <span class="pulse--ring" aria-hidden="true"></span>
  <img class="logo" src="assets/logos/EHS-logo-white.svg" alt="EHS — Egyptian Hospital Supplies">
</div>

<div class="bar">
  <button id="replay">Replay</button>
  <a href="index.html">Back to the site</a>
</div>

<script>
  var loader = document.getElementById('loader');
  function play(){ loader.classList.remove('play'); void loader.offsetWidth; loader.classList.add('play'); }
  document.getElementById('replay').addEventListener('click', play);
  setInterval(play, 4200);
</script>
</body>
</html>
