# Render deployment — static site preview for the EHS website.
# The site is plain HTML/CSS/JS and is committed pre-built, so no build step
# is required. To regenerate pages after editing _build/content, run
# `python3 _build/build.py` locally and commit the result.
services:
  - type: web
    name: ehs-website
    runtime: static
    staticPublishPath: .
    buildCommand: "echo 'Static site — no build step required'"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /quality.html
        destination: /factory.html
      # Render's static publish is additive: files deleted from the repo stay
      # on the CDN until a cache-clearing deploy. These sample pages were
      # removed in git but kept being served, so they are routed away here
      # too — config beats leftover files.
      - type: redirect
        source: /gallery-samples.html
        destination: /
      - type: redirect
        source: /leadership-samples.html
        destination: /
      - type: redirect
        source: /loader-preview.html
        destination: /
      - type: redirect
        source: /loading-concepts.html
        destination: /
      - type: redirect
        source: /loading-samples.html
        destination: /
      - type: redirect
        source: /loading-samples-2.html
        destination: /
      - type: redirect
        source: /loading-samples-3.html
        destination: /
      - type: redirect
        source: /loading-samples-4.html
        destination: /
      - type: redirect
        source: /location-samples.html
        destination: /
      - type: redirect
        source: /location-map-samples.html
        destination: /
      - type: redirect
        source: /timeline-samples.html
        destination: /
